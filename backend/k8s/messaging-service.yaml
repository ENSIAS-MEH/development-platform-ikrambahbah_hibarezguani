apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging-service

  template:
    metadata:
      labels:
        app: messaging-service

    spec:
      containers:
        - name: messaging-service
          image: messaging-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"

---
apiVersion: v1
kind: Service
metadata:
  name: messaging-service

spec:
  selector:
    app: messaging-service

  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8086
