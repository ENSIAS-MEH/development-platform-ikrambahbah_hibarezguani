server:
  port: 8085

spring:
  application:
    name: projet-service

  datasource:
    url: jdbc:mysql://localhost:3306/project_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: project_user
    password: project_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ceciEstUnSecretTresLongEtSecurise12345678

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/