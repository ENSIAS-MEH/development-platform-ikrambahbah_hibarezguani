spring.application.name=messaging-service

server.port=8086

# =========================
# DATABASE MYSQL
# =========================
spring.datasource.url=jdbc:mysql://mysql-external:3306/messaging_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================
jwt.secret=ceciEstUnSecretTresLongEtSecurise12345678

# =========================
# FILE UPLOAD
# =========================
file.upload-dir=/app/uploads/
file.base-url=http://localhost:8086/uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# STATIC RESOURCES
# =========================
spring.web.resources.static-locations=classpath:/static/,file:/app/uploads/
spring.mvc.static-path-pattern=/**

# =========================
# EUREKA
# =========================
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
eureka.instance.prefer-ip-address=true

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=*
