apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: auth-service:test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service

spec:
  selector:
    app: auth-service

  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084